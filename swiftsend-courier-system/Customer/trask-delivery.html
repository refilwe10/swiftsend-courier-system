<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwiftSend Couriers – Track Delivery</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="../index.html" class="logo">Swift<span>Send</span></a>

            <nav class="main-nav">
                <a href="../index.html" class="nav-link">Home</a>
                <a href="../about.html" class="nav-link">About</a>
                <a href="../services.html" class="nav-link">Services</a>
                <a href="../contact.html" class="nav-link">Contact</a>
            </nav>

            <div class="role-btns">
                <a href="login.html" class="role-btn" style="background:var(--accent);border-color:var(--accent);">Logout</a>
            </div>

    </header>

    <main class="container">
        <h2 class="section-title">Track Your Parcel</h2>
        <div class="card max-w-560">
            <div class="form-group">
                <label>Tracking Number</label>
                <input type="text" id="track-input" placeholder="e.g. SS-123456" value="SS-123456">
            </div>
            <button class="btn btn-primary" onclick="trackParcel()">Track Now</button>
            <p class="text-center mt-2"><a href="dashboard.html">← Back to Dashboard</a></p>
        </div>

        <div id="track-result" class="card mt-3 max-w-560" style="display:none;"></div>
    </main>

    <footer>
